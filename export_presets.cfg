; Presets de export (Plan «Builds Públicas con Consentimiento», M2). Se exporta con
; tools/export.sh, que genera res://augur_release.cfg con la clave de prod y lo borra al acabar;
; include_filter lo mete en el .pck porque el filtro por defecto no incluye .cfg sueltos.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="augur_release.cfg"
exclude_filter=""
export_path="builds/linux/Balactorio.x86_64"

[preset.0.options]

binary_format/embed_pck=false
binary_format/architecture="x86_64"

[preset.1]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="augur_release.cfg"
exclude_filter=""
export_path="builds/windows/Balactorio.exe"

[preset.1.options]

binary_format/embed_pck=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
